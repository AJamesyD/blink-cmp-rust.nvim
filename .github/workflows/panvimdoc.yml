name: panvimdoc

on:
  push:
    branches: [mainline]
    paths: [README.md]

permissions:
  contents: write

jobs:
  docs:
    if: github.repository == 'AJamesyD/blink-cmp-rust.nvim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p doc
      - uses: kdheepak/panvimdoc@v4.0.1
        with:
          vimdoc: blink-cmp-rust
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: auto-generate vimdoc"
